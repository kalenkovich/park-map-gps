<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Park Map — Phase 0</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="toolbar">
      <span id="status"></span>
      <button id="compute-btn" disabled>Compute transform</button>
      <button id="reset-btn" hidden>Reset</button>
      <button id="export-btn" hidden>Export bundle</button>
      <label id="import-label">
        Import bundle
        <input id="import-input" type="file" accept=".json" hidden />
      </label>
    </div>
    <div id="panels">
      <div id="photo-panel">
        <div id="photo-container">
          <img id="photo" src="/jerusalem-old-city.png" alt="Map of Jerusalem Old City" />
        </div>
      </div>
      <div id="map-panel">
        <div id="map"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
